# ============================================================
# 财运局 · 日志轮转配置（P1-6 修复）
# ============================================================
# 部署: sudo cp logrotate.conf /etc/logrotate.d/caiyunju
# 测试: sudo logrotate -d /etc/logrotate.d/caiyunju
# 手动执行: sudo logrotate -f /etc/logrotate.d/caiyunju
# ============================================================

/home/ubuntu/caiyunju/server-marketSign/serve.log
/home/ubuntu/caiyunju/server-marketSign/cron.log
/home/ubuntu/caiyunju/server-marketSign/logs/gunicorn-access.log
/home/ubuntu/caiyunju/server-marketSign/logs/gunicorn-error.log
/home/ubuntu/caiyunju/server-marketSign/logs/access.log {
    daily
    rotate 7
    maxsize 10M
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    create 0644 ubuntu ubuntu
    dateext
    dateformat -%Y%m%d
}
