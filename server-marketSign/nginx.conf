# ============================================================
# 财运局 · Nginx 反向代理配置（P0-3/P0-4 安全加固）
# ============================================================
# 使用前：
#   1. 替换 caiyunju.example.com 为你的备案域名
#   2. 复制到服务器: sudo cp nginx.conf /etc/nginx/sites-available/caiyunju
#   3. 启用站点: sudo ln -s /etc/nginx/sites-available/caiyunju /etc/nginx/sites-enabled/
#   4. 测试配置: sudo nginx -t
#   5. 重载: sudo systemctl reload nginx
#   6. 配置 HTTPS: sudo certbot --nginx -d caiyunju.example.com
#
# 后端：gunicorn 监听 127.0.0.1:5818（仅内网）
# ============================================================

# ---- HTTP 服务器（获取证书后自动升级为 HTTPS）----
server {
    listen 80;
    server_name caiyunju.example.com;

    # 安全头（应用层）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:" always;

    # Nginx 层限流（作为 Flask 内存限流的补充）
    limit_req_zone $binary_remote_addr zone=caiyunju_api:10m rate=5r/s;
    limit_req zone=caiyunju_api burst=10 nodelay;

    # 请求体大小限制（防大请求攻击）
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # 日志
    access_log /var/log/nginx/caiyunju-access.log;
    error_log /var/log/nginx/caiyunju-error.log;

    # ---- API 反向代理到 gunicorn ----
    location /api/ {
        proxy_pass http://127.0.0.1:5818;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        add_header Cache-Control "public, max-age=60";
    }

    # ---- 健康检查 ----
    location /health {
        proxy_pass http://127.0.0.1:5818;
        proxy_set_header Host $host;
    }

    # ---- 静态 JSON 直接由 Nginx 服务（高性能 + 缓存）----
    location /daily-sign.json {
        alias /home/ubuntu/caiyunju/server-marketSign/output/daily-sign.json;
        add_header Cache-Control "public, max-age=60";
        add_header Content-Type "application/json; charset=utf-8";
        # CORS 白名单（与 Flask 层保持一致）
        set $cors "false";
        if ($http_origin = "http://localhost:5817") { set $cors "true"; }
        if ($http_origin = "http://127.0.0.1:5817") { set $cors "true"; }
        if ($http_origin = "https://zhaocaibu.cn") { set $cors "true"; }
        if ($cors = "true") {
            add_header Access-Control-Allow-Origin "$http_origin";
        }
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
    }

    # ---- v3.2 盘中快照 JSON（10:00 / 11:30 / 14:00）----
    location /daily-sign-10.json {
        alias /home/ubuntu/caiyunju/server-marketSign/output/daily-sign-10.json;
        add_header Cache-Control "public, max-age=60";
        add_header Content-Type "application/json; charset=utf-8";
    }
    location /daily-sign-11.json {
        alias /home/ubuntu/caiyunju/server-marketSign/output/daily-sign-11.json;
        add_header Cache-Control "public, max-age=60";
        add_header Content-Type "application/json; charset=utf-8";
    }
    location /daily-sign-14.json {
        alias /home/ubuntu/caiyunju/server-marketSign/output/daily-sign-14.json;
        add_header Cache-Control "public, max-age=60";
        add_header Content-Type "application/json; charset=utf-8";
    }

    # ---- 根路径 ----
    location / {
        proxy_pass http://127.0.0.1:5818;
        proxy_set_header Host $host;
    }
}

